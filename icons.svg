<!--
  ICON SPRITE — all icons used across the site live here as <symbol> defs.
  Referenced from index.html like:
    <svg class="icon" width="20" height="20" aria-hidden="true">
      <use href="icons.svg#icon-github"></use>
    </svg>

  To swap an icon: replace the <path>/<circle> content inside the matching
  <symbol>...</symbol> block (grab replacements from lucide.dev, phosphoricons.com,
  or tabler.io/icons — keep viewBox="0 0 24 24" and stroke="currentColor" so it
  inherits the surrounding text color).

  NOTE: <use href="icons.svg#id"> only loads over http(s) — it will not render
  if you just double-click index.html and open it as a file:// page. Serve the
  folder locally (e.g. `npx serve` or VS Code "Live Server") or view it on
  GitHub Pages once deployed, and the icons will appear correctly.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- Brand mark / GNN-style node network -->
  <symbol id="icon-network" viewBox="0 0 24 24" fill="none">
    <circle cx="5" cy="6" r="2.4" fill="currentColor"/>
    <circle cx="19" cy="6" r="2.4" fill="currentColor"/>
    <circle cx="12" cy="18" r="2.4" fill="currentColor"/>
    <path d="M6.9 7.4L11 16.6M17.1 7.4L13 16.6M7.4 6H16.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  </symbol>

  <!-- Node network variant (4 nodes) used for ML/skill icons -->
  <symbol id="icon-network-nodes" viewBox="0 0 24 24" fill="none">
    <circle cx="5" cy="6" r="2" stroke="currentColor" stroke-width="1.6"/>
    <circle cx="19" cy="6" r="2" stroke="currentColor" stroke-width="1.6"/>
    <circle cx="12" cy="18" r="2" stroke="currentColor" stroke-width="1.6"/>
    <circle cx="12" cy="10" r="2" stroke="currentColor" stroke-width="1.6"/>
    <path d="M6.7 7.1 10.5 9M17.3 7.1 13.5 9M12 12v4" stroke="currentColor" stroke-width="1.6"/>
  </symbol>

  <symbol id="icon-arrow-right" viewBox="0 0 24 24" fill="none">
    <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-arrow-up" viewBox="0 0 24 24" fill="none">
    <path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-send" viewBox="0 0 24 24" fill="none">
    <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-external" viewBox="0 0 24 24" fill="none">
    <path d="M14 4h6v6M20 4 10 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </symbol>

  <symbol id="icon-github" viewBox="0 0 24 24" fill="none">
    <path d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.49 0-.24-.01-1.04-.01-1.89-2.78.62-3.37-1.21-3.37-1.21-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.9 1.58 2.36 1.12 2.93.86.09-.67.35-1.12.64-1.38-2.22-.26-4.56-1.14-4.56-5.05 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.31.1-2.72 0 0 .84-.28 2.75 1.05a9.3 9.3 0 0 1 2.5-.35c.85 0 1.71.12 2.5.35 1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.46.1 2.72.64.72 1.03 1.63 1.03 2.75 0 3.92-2.34 4.78-4.57 5.04.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .27.18.6.69.49A10.26 10.26 0 0 0 22 12.25C22 6.58 17.52 2 12 2Z" fill="currentColor"/>
  </symbol>

  <symbol id="icon-linkedin" viewBox="0 0 24 24" fill="none">
    <path d="M6.94 8.5H4.06V19H6.94V8.5ZM5.5 7.25c.97 0 1.63-.66 1.63-1.5S6.47 4.25 5.5 4.25c-.96 0-1.63.66-1.63 1.5s.67 1.5 1.63 1.5ZM20 12.85c0-2.66-1.43-3.9-3.34-3.9-1.54 0-2.23.86-2.61 1.46V8.5h-2.88c.04.8 0 10.5 0 10.5h2.88v-5.86c0-.31.02-.63.11-.85.25-.63.82-1.28 1.77-1.28 1.25 0 1.75.95 1.75 2.35V19H20v-6.15Z" fill="currentColor"/>
  </symbol>

  <symbol id="icon-kaggle" viewBox="0 0 24 24" fill="none">
    <path d="M18.5 20.2h-3.1a.6.6 0 0 1-.5-.25l-4.4-5.8-1.6 1.5v4a.5.5 0 0 1-.5.5H6a.5.5 0 0 1-.5-.5V4a.5.5 0 0 1 .5-.5h2.4a.5.5 0 0 1 .5.5v9.3l4.9-4.9a.7.7 0 0 1 .5-.2h3.2c.4 0 .6.5.3.8l-5.3 5 5.9 7.3c.2.4 0 .9-.4.9Z" fill="currentColor"/>
  </symbol>

  <symbol id="icon-mail" viewBox="0 0 24 24" fill="none">
    <path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-11Z" stroke="currentColor" stroke-width="1.6"/>
    <path d="m4 6.5 8 6.5 8-6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-location" viewBox="0 0 24 24" fill="none">
    <path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="12" cy="9.5" r="2.4" stroke="currentColor" stroke-width="1.6"/>
  </symbol>

  <symbol id="icon-user" viewBox="0 0 24 24" fill="none">
    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.6"/>
  </symbol>

  <!-- Education: graduation cap -->
  <symbol id="icon-cap" viewBox="0 0 24 24" fill="none">
    <path d="M22 10 12 5 2 10l10 5 10-5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M6 12v5c0 1.1 2.7 2 6 2s6-.9 6-2v-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  </symbol>

  <!-- Education: open book / folder -->
  <symbol id="icon-book" viewBox="0 0 24 24" fill="none">
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  </symbol>

  <!-- Milestone: shield check (current/active state) -->
  <symbol id="icon-shield-check" viewBox="0 0 24 24" fill="none">
    <path d="M12 2 4 6v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6l-8-4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Milestone: clock/progress (alt current state) -->
  <symbol id="icon-clock" viewBox="0 0 24 24" fill="none">
    <path d="M12 2 4 6v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6l-8-4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M12 8v4l2.5 2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Skills: code brackets -->
  <symbol id="icon-code" viewBox="0 0 24 24" fill="none">
    <path d="m8 9-4 3 4 3M16 9l4 3-4 3M13 5l-2 14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Skills: wrench (tools) -->
  <symbol id="icon-wrench" viewBox="0 0 24 24" fill="none">
    <path d="M14.7 6.3a3.5 3.5 0 0 1-4.6 4.6L4 17l3 3 6.1-6.1a3.5 3.5 0 0 1 4.6-4.6L14.7 6.3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  </symbol>

  <!-- Skills: grid (core CS) -->
  <symbol id="icon-grid" viewBox="0 0 24 24" fill="none">
    <rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/>
    <path d="M4 10h16M10 10v10" stroke="currentColor" stroke-width="1.6"/>
  </symbol>

  <!-- Projects: camera / detection -->
  <symbol id="icon-camera" viewBox="0 0 24 24" fill="none">
    <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.4"/>
    <circle cx="9" cy="11" r="2" stroke="currentColor" stroke-width="1.4"/>
    <path d="m4 17 4.5-4 3 2.5L17 11l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Projects: bar chart / analysis -->
  <symbol id="icon-chart" viewBox="0 0 24 24" fill="none">
    <path d="M4 6h16M4 12h10M4 18h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="19" cy="12" r="1.6" fill="currentColor"/>
  </symbol>

  <!-- Projects: package / layers -->
  <symbol id="icon-package" viewBox="0 0 24 24" fill="none">
    <path d="M4 4h16v4H4zM4 10h10v4H4zM4 16h16v4H4z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
  </symbol>

  <!-- Experience: briefcase -->
  <symbol id="icon-briefcase" viewBox="0 0 24 24" fill="none">
    <path d="M9 3v4M15 3v4M4 8h16M6 8v11a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Experience: laurel / award -->
  <symbol id="icon-laurel" viewBox="0 0 24 24" fill="none">
    <path d="M12 15a5 5 0 0 0 5-5V4H7v6a5 5 0 0 0 5 5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M7 5H4v2a4 4 0 0 0 4 4M17 5h3v2a4 4 0 0 1-4 4M12 15v3M8 21h8M9 18h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

</svg>
