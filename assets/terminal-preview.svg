<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-labelledby="t d">
  <title id="t">rafi@terminal preview</title>
  <desc id="d">Preview of Md. Saleh Rafi's interactive terminal portfolio: running whoami and listing sections 01 to 05.</desc>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00bfff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <style>
      text { font-family: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; fill: #c9d6e6; }
      .muted { fill: #6c7f98; }
      .user { fill: #4ade80; font-weight: 700; }
      .path { fill: #00bfff; font-weight: 700; }
      .cyan { fill: #22d3ee; }
      .num { fill: #05080f; font-weight: 700; font-size: 13px; }
      .b { font-weight: 700; }
      .l { animation: show .2s backwards; }
      .l1 { animation-delay: .3s; } .l2 { animation-delay: 1.1s; } .l3 { animation-delay: 1.3s; }
      .l4 { animation-delay: 1.5s; } .l5 { animation-delay: 1.7s; } .l6 { animation-delay: 2.5s; }
      .l7 { animation-delay: 2.9s; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes show { from { opacity: 0; } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .l, .cursor { animation: none; } }
    </style>
  </defs>

  <rect x="1" y="1" width="858" height="398" rx="14" fill="#0a111d" stroke="#1b2a40"/>
  <rect x="1" y="1" width="858" height="398" rx="14" fill="url(#glow)"/>
  <path d="M1 15a14 14 0 0 1 14-14h830a14 14 0 0 1 14 14v25H1z" fill="#0d1626"/>
  <line x1="1" y1="40" x2="859" y2="40" stroke="#1b2a40"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="20" r="6" fill="#febc2e"/>
  <circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="430" y="25" text-anchor="middle" class="muted" style="font-size:13px">rafi@ewu: ~</text>
  <text x="836" y="25" text-anchor="end" style="font-size:13px;fill:#4ade80">● online</text>

  <g class="l l1">
    <text x="28" y="78"><tspan class="user">rafi@ewu</tspan>:<tspan class="path">~</tspan>$ whoami</text>
  </g>
  <g class="l l2">
    <text x="28" y="112"><tspan class="muted">name</tspan><tspan x="118" class="b">Md. Saleh Rafi</tspan></text>
  </g>
  <g class="l l3">
    <text x="28" y="136"><tspan class="muted">role</tspan><tspan x="118">Software Engineer · ML Researcher · Full Stack Developer</tspan></text>
  </g>
  <g class="l l4">
    <text x="28" y="160"><tspan class="muted">status</tspan><tspan x="118">CSE Graduate @ East West University (Sept 2026)</tspan></text>
  </g>
  <g class="l l5">
    <text x="28" y="184"><tspan class="muted">focus</tspan><tspan x="118" class="cyan">Reliable AI for Medical Imaging</tspan></text>
  </g>

  <g class="l l6">
    <text x="28" y="226"><tspan class="user">rafi@ewu</tspan>:<tspan class="path">~</tspan>$ ls sections/</text>
    <g transform="translate(28 246)">
      <rect width="150" height="54" rx="8" fill="#0d1626" stroke="#22d3ee"/>
      <rect x="10" y="10" width="26" height="18" rx="3" fill="#22d3ee"/><text x="23" y="24" text-anchor="middle" class="num">01</text>
      <text x="10" y="45">identity</text>
    </g>
    <g transform="translate(190 246)">
      <rect width="150" height="54" rx="8" fill="#0d1626" stroke="#1b2a40"/>
      <rect x="10" y="10" width="26" height="18" rx="3" fill="#00bfff"/><text x="23" y="24" text-anchor="middle" class="num">02</text>
      <text x="10" y="45">research</text>
    </g>
    <g transform="translate(352 246)">
      <rect width="150" height="54" rx="8" fill="#0d1626" stroke="#1b2a40"/>
      <rect x="10" y="10" width="26" height="18" rx="3" fill="#00bfff"/><text x="23" y="24" text-anchor="middle" class="num">03</text>
      <text x="10" y="45">projects</text>
    </g>
    <g transform="translate(514 246)">
      <rect width="150" height="54" rx="8" fill="#0d1626" stroke="#1b2a40"/>
      <rect x="10" y="10" width="26" height="18" rx="3" fill="#00bfff"/><text x="23" y="24" text-anchor="middle" class="num">04</text>
      <text x="10" y="45">skills</text>
    </g>
    <g transform="translate(676 246)">
      <rect width="156" height="54" rx="8" fill="#0d1626" stroke="#1b2a40"/>
      <rect x="10" y="10" width="26" height="18" rx="3" fill="#00bfff"/><text x="23" y="24" text-anchor="middle" class="num">05</text>
      <text x="10" y="45">academic</text>
    </g>
  </g>

  <g class="l l7">
    <text x="28" y="340" class="muted">Type `help` · try `coffee` or `sudo hire rafi`</text>
    <text x="28" y="372"><tspan class="user">rafi@ewu</tspan>:<tspan class="path">~</tspan>$ <tspan class="cyan cursor">█</tspan></text>
  </g>
</svg>
